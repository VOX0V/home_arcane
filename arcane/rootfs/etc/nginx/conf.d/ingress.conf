server {
  listen 8099;
  client_max_body_size 0;
  allow 172.30.32.2;
  deny all;

  # Arcane is a modern SPA. Rewrite absolute root paths to the active
  # Home Assistant ingress prefix in HTML/JS requests where possible.
  # This is a compatibility shim and must be tested against the target Arcane release.
  location / {
    proxy_pass http://127.0.0.1:3552;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Ingress-Path $http_x_ingress_path;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect ~^https?://[^/]+/(.*)$ $http_x_ingress_path/$1;
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/css;
    sub_filter 'src="/' 'src="__HA_INGRESS_PREFIX__/';
    sub_filter 'href="/' 'href="__HA_INGRESS_PREFIX__/';
    sub_filter '"/api/' '"__HA_INGRESS_PREFIX__/api/';
    sub_filter '"/assets/' '"__HA_INGRESS_PREFIX__/assets/';
    sub_filter '__HA_INGRESS_PREFIX__' '$http_x_ingress_path';
  }
}
